<html lang="en">

<title>SovereignTapes</title>

<style>
/* Layout: desktop = sidebar + content + docked player bar; phone = content + mini player + floating pill tab bar; full-screen Now Playing on both. Single dark look by choice. */
:root{--bg:#0a0a0b;--panel:#151517;--panel2:#1e1e21;--line:#2a2a2f;--text:#f6f6f2;--mute:#8e8e95;--acc:#c9f73a;--ink:#101300;--card:#f4f4f0;
 --font:'Plus Jakarta Sans',system-ui,'Segoe UI',sans-serif;--r:20px;--side:240px;--bar:84px;color-scheme:dark}
*{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}html{-webkit-text-size-adjust:100%}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.i{width:22px;height:22px;flex:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;fill:none}.i.f{fill:currentColor;stroke:none}
/* sidebar (desktop) */
#side{position:fixed;top:0;left:0;bottom:var(--bar);width:var(--side);padding:calc(22px + env(safe-area-inset-top,0px)) 16px 16px max(16px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;background:var(--bg);z-index:20}
.logo{font-weight:800;font-size:21px;letter-spacing:-.02em;padding:0 10px 18px;display:flex;align-items:center;gap:8px}.logo b{color:var(--acc)}
.logo .mark{width:32px;height:32px;flex:none;filter:drop-shadow(0 0 10px rgba(255,214,10,.45));transition:transform .35s var(--spring,ease)}.logo:hover .mark{transform:scale(1.08) rotate(-4deg)}
.navl{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:999px;color:var(--mute);font-weight:600}.navl:hover{color:var(--text);background:var(--panel)}.navl.on{background:var(--acc);color:var(--ink)}
#side .drop{margin-top:14px}
/* main */
main{margin-left:var(--side);padding:calc(24px + env(safe-area-inset-top,0px)) max(28px,env(safe-area-inset-right,0px)) calc(var(--bar) + 40px) 32px;max-width:calc(var(--side) + 1240px);min-width:0}
.top{display:flex;align-items:center;gap:12px;margin-bottom:22px}.hello{flex:1;min-width:0;color:var(--mute);font-size:16px}.hello b{color:var(--text);font-weight:700}
.rbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);border:0;color:var(--text);position:relative}.rbtn.light{background:var(--card);color:#111}
.rbtn .pip{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--acc)}
h1{font-size:34px;line-height:1.1;letter-spacing:-.03em;margin:0 0 6px;text-wrap:balance;font-weight:800}
h2{font-size:19px;font-weight:700;letter-spacing:-.01em;margin:30px 0 14px;display:flex;align-items:center;gap:10px}h2 .see{margin-left:auto;font-size:13px;font-weight:500;color:var(--mute);display:flex;align-items:center;gap:2px}h2 .see .i{width:16px;height:16px}
.sub{color:var(--mute);max-width:62ch;margin:0 0 6px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 18px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:14px;font-weight:500;color:var(--text)}.chip.on{background:var(--acc);color:var(--ink);border-color:var(--acc);font-weight:700}
.hs{display:grid;grid-auto-flow:column;grid-auto-columns:clamp(150px,17vw,200px);gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:4px}.hs::-webkit-scrollbar{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:20px}
.tile{scroll-snap-align:start;cursor:pointer;min-width:0}.tile .cv{position:relative;aspect-ratio:1;border-radius:16px;overflow:hidden;background:var(--panel2)}
.cv img{width:100%;height:100%;object-fit:cover;display:block}
.tile .t{margin-top:10px;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid var(--acc);padding-left:8px;line-height:1.2}
.tile .a{color:var(--mute);font-size:12.5px;padding-left:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);color:#fff;border-radius:999px;padding:3px 10px;font-size:11px;font-weight:700;max-width:calc(100% - 20px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tag.lime{background:var(--acc);color:var(--ink)}
.rank{position:absolute;left:12px;bottom:6px;font-size:44px;font-weight:800;color:#fff;-webkit-text-stroke:1px rgba(0,0,0,.4);text-shadow:0 4px 18px rgba(0,0,0,.7);letter-spacing:-.04em}
.fab{position:absolute;right:10px;bottom:10px;width:42px;height:42px;border-radius:50%;background:var(--acc);color:var(--ink);border:0;display:grid;place-items:center;opacity:0;transform:translateY(6px);transition:.18s;box-shadow:0 6px 20px rgba(0,0,0,.5)}.tile:hover .fab,.tile:focus-within .fab{opacity:1;transform:none}
.coll{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(280px,1fr);gap:16px;overflow-x:auto;scrollbar-width:none}.coll::-webkit-scrollbar{display:none}
.bn{position:relative;border-radius:var(--r);padding:22px;min-height:150px;color:#111;overflow:hidden;display:flex;flex-direction:column;cursor:pointer}

.bn img{position:absolute;right:-10px;bottom:-10px;width:46%;aspect-ratio:1;object-fit:cover;border-radius:16px;transform:rotate(8deg);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.moods{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.mood{position:relative;height:96px;border-radius:16px;padding:14px 16px;overflow:hidden;font-weight:700;color:#fff;border:0;text-align:left;font-size:15px}
.mood img{position:absolute;right:-8px;bottom:-12px;width:78px;height:78px;border-radius:10px;object-fit:cover;transform:rotate(16deg);box-shadow:0 6px 16px rgba(0,0,0,.4)}
.ex{display:grid;grid-auto-flow:column;grid-auto-columns:clamp(160px,18vw,210px);gap:14px;overflow-x:auto;scrollbar-width:none}.ex::-webkit-scrollbar{display:none}
.ex .tile .cv{aspect-ratio:3/4;border-radius:18px}.ex .cap{position:absolute;left:12px;bottom:12px;right:12px;font-weight:700;text-shadow:0 2px 8px #000}
.ex .cv::after{content:"";position:absolute;inset:40% 0 0;background:linear-gradient(transparent,rgba(0,0,0,.75))}.ex .cap{z-index:1}
.sbox{display:flex;align-items:center;gap:10px;background:var(--panel2);border-radius:999px;padding:12px 18px;color:var(--mute);max-width:560px}.sbox input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text)}
/* tape page */
.tp{display:grid;grid-template-columns:minmax(220px,320px) 1fr;gap:32px;align-items:start}.tp>div{min-width:0}.tp .cv{aspect-ratio:1;border-radius:24px;overflow:hidden;background:var(--panel2);box-shadow:0 20px 60px rgba(0,0,0,.5)}
.kick{color:var(--acc);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.meta{color:var(--mute);display:flex;flex-wrap:wrap;gap:4px 14px;margin:6px 0 16px;font-size:14px}.meta a b{color:var(--text)}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 16px}.stats div{background:var(--panel);border-radius:14px;padding:10px 16px;color:var(--mute);font-size:12px}.stats b{display:block;color:var(--text);font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--acc);color:var(--ink);border:0;border-radius:999px;padding:11px 20px;font-weight:700;white-space:nowrap}.btn:hover{filter:brightness(1.06)}.btn:disabled{opacity:.6;cursor:wait}
.btn.ghost{background:var(--panel2);color:var(--text)}.btn.on{background:var(--text);color:var(--bg)}.btn .i{width:18px;height:18px}
.list{margin-top:18px;display:flex;flex-direction:column;gap:4px}
.tr{display:grid;grid-template-columns:34px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 12px;border-radius:14px;cursor:pointer}.tr:hover{background:var(--panel)}
.tr.on{background:var(--panel2)}.tr.on b{color:var(--acc)}.tr .n{color:var(--mute);text-align:center;font-variant-numeric:tabular-nums}.tr .d{color:var(--mute);font-size:13px;font-variant-numeric:tabular-nums}
.ib{background:none;border:0;color:var(--mute);padding:6px;border-radius:50%;display:grid;place-items:center}.ib:hover{color:var(--text);background:var(--panel2)}.ib.on{color:var(--acc)}
.chart .tr{grid-template-columns:40px 52px minmax(0,1fr) auto}.chart img{width:52px;height:52px;border-radius:12px;object-fit:cover}.chart .n{font-size:18px;font-weight:800;color:var(--text)}
.panel{background:var(--panel);border-radius:var(--r);padding:20px;min-width:0}
.cm{padding:12px 0;border-top:1px solid var(--line);overflow-wrap:anywhere}.cm b{margin-right:8px}.cm .ts{color:var(--mute);font-size:12px}
.cd{font-size:40px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin:4px 0 12px}
label{display:block;font-size:13px;color:var(--mute);margin:14px 0 6px;font-weight:500}
input[type=text],input[type=password],input[type=datetime-local],select,textarea{width:100%;background:var(--panel2);border:1px solid transparent;border-radius:14px;padding:11px 14px}input:focus,select:focus,textarea:focus{border-color:var(--acc);outline:0}
.dz{border:1.5px dashed var(--line);border-radius:16px;padding:22px;text-align:center;color:var(--mute);cursor:pointer;display:grid;gap:6px;justify-items:center}.dz.over{border-color:var(--acc);color:var(--text)}
.up .tr{grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) auto;cursor:default}.up .tr input{padding:8px 11px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.empty{color:var(--mute);padding:32px;text-align:center;border:1.5px dashed var(--line);border-radius:var(--r)}.empty b{color:var(--text)}
.note{background:var(--panel2);border-radius:14px;padding:12px 16px;color:var(--mute);margin-bottom:16px}
.hero{position:relative;display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center;background:var(--panel);border-radius:28px;padding:24px;overflow:hidden}
.hero .cv{width:200px;aspect-ratio:1;border-radius:20px;overflow:hidden}.hero>div{min-width:0}
/* desktop player bar */
#bar{position:fixed;left:0;right:0;bottom:0;height:calc(var(--bar) + env(safe-area-inset-bottom,0px));padding:0 max(20px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(20px,env(safe-area-inset-left,0px));background:#0f0f11;border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,300px) 1fr minmax(0,240px);gap:20px;align-items:center;z-index:30}
.now{display:flex;gap:12px;align-items:center;min-width:0;cursor:pointer}.now img{width:54px;height:54px;border-radius:12px;object-fit:cover;background:var(--panel2);flex:none}.now div{min-width:0}

.ctl{display:flex;align-items:center;justify-content:center;gap:18px}.npx{display:flex;justify-content:center;gap:10px;margin-top:14px}.npx .chip{display:inline-flex;align-items:center;gap:6px}.pp{width:46px;height:46px;border-radius:50%;background:var(--acc);color:var(--ink);border:0;display:grid;place-items:center}
.seek{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:4px;border-radius:4px;background:linear-gradient(var(--acc),var(--acc)) 0/var(--p,0%) 100% no-repeat,#3a3a40;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--acc);border:0}input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--acc);border:0}
.mid{display:flex;flex-direction:column;gap:6px;max-width:620px;width:100%;justify-self:center}.rt{display:flex;gap:10px;align-items:center;justify-content:flex-end}.rt input{max-width:110px}
/* phone tab bar + mini player */
#tabs,#mini{display:none}
/* now playing */
#np{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;padding:calc(16px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);visibility:hidden}

.npq h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:6px 0 10px;font-weight:700}
#toast{position:fixed;bottom:calc(var(--bar) + 18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60;max-width:90vw;text-align:center}#toast.show{opacity:1}

.pk{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:16px}.pk .panel{background:var(--panel2);display:grid;gap:8px}.pk .btn{justify-content:center}
.feat{grid-auto-columns:minmax(300px,520px)}.ft{position:relative;display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center;background:var(--panel);border-radius:var(--r);padding:14px;cursor:pointer;min-width:0}

.cdx b{display:block;font-size:30px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1;color:var(--acc)}.cdx span{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.1em}

.split{grid-auto-columns:minmax(260px,1fr)}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:1100px){:root{--side:88px}#side .lbl,.logo span{display:none}.navl{justify-content:center;padding:12px}#side .drop{padding:12px;justify-content:center}.logo{justify-content:center;padding:0 0 18px}}

 main{margin:0;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(170px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
 h1{font-size:28px}.hs{grid-auto-columns:42vw;gap:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.coll{grid-auto-columns:82%}.moods{grid-template-columns:1fr 1fr}.ex{grid-auto-columns:40vw}
 .tp,.npg,.two{grid-template-columns:1fr}.tp .cv{max-width:300px;width:100%;margin:0 auto}.hero{grid-template-columns:1fr}.hero .cv{width:100%;max-width:260px}
 .fab{opacity:1;transform:none;width:36px;height:36px}.up .tr{grid-template-columns:24px minmax(0,1fr) auto}.up .tr input[data-k=feat]{display:none}
 #tabs{display:flex;position:fixed;left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:30;background:#121214;border:1px solid var(--line);border-radius:999px;padding:7px;justify-content:space-between;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.6)}
 #tabs a{display:flex;align-items:center;gap:7px;padding:10px 13px;border-radius:999px;color:var(--mute);font-weight:700;font-size:14px}#tabs a .lbl{display:none}#tabs a.on{background:var(--acc);color:var(--ink)}#tabs a.on .lbl{display:inline}
 #mini{position:fixed;left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:29;background:var(--panel2);border-radius:18px;padding:8px 8px 8px 8px;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
 #mini.show{display:flex}#mini .now{flex:1}#mini .now img{width:44px;height:44px;border-radius:10px}#mini .pp{width:40px;height:40px}
 #mini .prog{position:absolute;left:16px;right:16px;bottom:3px;height:2px;background:#3a3a40;border-radius:2px;overflow:hidden}#mini .prog i{display:block;height:100%;width:0;background:var(--acc)}
 #toast{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
 .npg{margin-top:20px;gap:24px}.npc{max-width:420px;width:100%;margin:0 auto}
}
